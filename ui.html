<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'DM Sans', sans-serif;
        background: #0f0f0f;
        color: #f0ede8;
        padding: 20px;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0ede8;
      }

      .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #6c38f5;
        display: inline-block;
        margin-left: 2px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }

      button#analyze {
        width: 100%;
        padding: 11px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
        border-radius: 8px;
        border: none;
        background: #38f542;
        color: #0f0f0f;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }
      button#analyze:hover  { opacity: 0.88; }
      button#analyze:active { transform: scale(0.98); }

      /* ── section titles ── */
      .section-title {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #444;
        margin: 18px 0 10px;
      }

      /* ── metric grid ── */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .metric {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .metric.visible { opacity: 1; transform: translateY(0); }

      .metric:nth-child(1)  { transition-delay: 0.00s; }
      .metric:nth-child(2)  { transition-delay: 0.06s; }
      .metric:nth-child(3)  { transition-delay: 0.12s; }
      .metric:nth-child(4)  { transition-delay: 0.18s; }
      .metric:nth-child(5)  { transition-delay: 0.24s; }
      .metric:nth-child(6)  { transition-delay: 0.30s; }
      .metric:nth-child(7)  { transition-delay: 0.36s; }
      .metric:nth-child(8)  { transition-delay: 0.42s; }
      .metric:nth-child(9)  { transition-delay: 0.48s; }
      .metric:nth-child(10) { transition-delay: 0.54s; }

      .metric.wide { grid-column: 1 / -1; }

      .metric-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #666;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .author {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #f538a0;
        background: rgba(245, 56, 160, 0.12);
        border-radius: 4px;
        padding: 1px 5px;
      }

      .metric-value {
        font-family: 'DM Mono', monospace;
        font-size: 26px;
        font-weight: 500;
        color: #f0ede8;
        line-height: 1;
      }
      .metric-value.warn   { color: #f5a623; }
      .metric-value.danger { color: #ff6b6b; }
      .metric-value.ok     { color: #38f542; }

      .bar-track {
        height: 4px;
        background: #2a2a2a;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        border-radius: 99px;
        background: #c8f560;
        width: 0%;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .metric-sub {
        font-size: 10px;
        color: #555;
        font-family: 'DM Mono', monospace;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 2px;
      }
      .tag {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        background: #222;
        border: 1px solid #333;
        border-radius: 5px;
        padding: 2px 7px;
        color: #999;
      }
      .tag.violation {
        color: #ff6b6b;
        border-color: #4a1a1a;
        background: #1f0f0f;
      }

      /* ── violation list panel ── */
      .vlist-section {
        margin-top: 24px;
        padding-bottom: 8px;
      }

      /* collapsible group */
      .vgroup {
        margin-bottom: 8px;
        border: 1px solid #222;
        border-radius: 10px;
        overflow: hidden;
      }

      .vgroup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        background: #161616;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
      }
      .vgroup-header:hover { background: #1e1e1e; }

      .vgroup-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .vgroup-count {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        color: #f5a623;
        background: rgba(245, 166, 35, 0.1);
        border-radius: 4px;
        padding: 1px 6px;
      }
      .vgroup-count.danger {
        color: #ff6b6b;
        background: rgba(255, 107, 107, 0.1);
      }
      .vgroup-count.ok {
        color: #38f542;
        background: rgba(56, 245, 66, 0.08);
      }

      .vgroup-chevron {
        font-size: 10px;
        color: #444;
        transition: transform 0.2s;
      }
      .vgroup.open .vgroup-chevron { transform: rotate(180deg); }

      .vgroup-body {
        display: none;
        flex-direction: column;
      }
      .vgroup.open .vgroup-body { display: flex; }

      /* individual node row */
      .vnode {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-top: 1px solid #1e1e1e;
        cursor: pointer;
        transition: background 0.12s;
      }
      .vnode:hover { background: #1a1a1a; }
      .vnode:active { background: #222; }

      .vnode-icon {
        font-size: 11px;
        flex-shrink: 0;
        opacity: 0.5;
      }

      .vnode-name {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: #bbb;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1;
      }

      .vnode-arrow {
        font-size: 10px;
        color: #333;
        flex-shrink: 0;
        transition: color 0.12s;
      }
      .vnode:hover .vnode-arrow { color: #666; }

      .empty-state {
        padding: 10px 14px;
        border-top: 1px solid #1e1e1e;
        font-size: 11px;
        color: #444;
        font-family: 'DM Mono', monospace;
      }

      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #1f0f0f;
        border: 1px solid #4a1a1a;
        color: #ff6b6b;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Frame Inspector</h1>
      <span class="dot"></span>
    </header>

    <button id="analyze">Analyze selection</button>

    <div id="output"></div>

    <script>
      const output     = document.getElementById('output');
      const analyzeBtn = document.getElementById('analyze');

      analyzeBtn.onclick = () => {
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
      };

      function pct(val) {
        return (val * 100).toFixed(1) + '%';
      }

      function severity(val, warnAt, dangerAt) {
        if (val >= dangerAt) return 'danger';
        if (val >= warnAt)   return 'warn';
        return 'ok';
      }

      function renderTags(items, className = '') {
        if (!items || items.length === 0) return '';
        return `<div class="tag-list">${items.map(t => `<span class="tag ${className}">${t}</span>`).join('')}</div>`;
      }

      // Send a select-node message to the plugin when a row is clicked
      function selectNode(id) {
        parent.postMessage({ pluginMessage: { type: 'select-node', id } }, '*');
      }

      // Build one collapsible violation group
      function renderViolationGroup(title, icon, nodes) {
        const count   = nodes.length;
        const cntClass = count === 0 ? 'ok' : count >= 5 ? 'danger' : '';
        const rows = count === 0
          ? `<div class="empty-state">No violations found ✓</div>`
          : nodes.map(n => `
              <div class="vnode" onclick="selectNode('${n.id}')">
                <span class="vnode-icon">${icon}</span>
                <span class="vnode-name" title="${n.name}">${n.name}</span>
                <span class="vnode-arrow">▶</span>
              </div>`).join('');

        return `
          <div class="vgroup">
            <div class="vgroup-header" onclick="this.closest('.vgroup').classList.toggle('open')">
              <span class="vgroup-title">
                ${title}
                <span class="vgroup-count ${cntClass}">${count}</span>
              </span>
              <span class="vgroup-chevron">▼</span>
            </div>
            <div class="vgroup-body">${rows}</div>
          </div>`;
      }

      onmessage = (event) => {
        const msg = event.data.pluginMessage;

        if (msg.type === 'error') {
          output.innerHTML = `<div class="error">${msg.message}</div>`;
          return;
        }

        if (msg.type === 'result') {
          const {
            totalNodes,
            maxDepth,
            componentProportion,
            autoLayoutProportion,
            numberedNameCount,
            effectCount,
            groupCount,
            detachedInstanceCount,
            unusualSpacingCount,
            unusualSpacingValues,
            typefaceCount,
            typefaceNames,
            accessibilityViolations,
            accessibilityDetails,
            totalStyles,
            // Violation node lists
            accessibilityNodes,
            unlinkedStyleNodes,
            offGridNodes,
            numberedNameNodes,
            noAutoLayoutNodes,
          } = msg.data;

          const spacingTags = (unusualSpacingValues || []).map(v => v + 'px');

          output.innerHTML = `
            <!-- ── Section 1: Structure ── -->
            <div class="grid">
              <div class="metric">
                <span class="metric-label">Elements</span>
                <span class="metric-value">${totalNodes}</span>
              </div>
              <div class="metric">
                <span class="metric-label">Max depth</span>
                <span class="metric-value ${severity(maxDepth, 8, 14)}">${maxDepth}</span>
              </div>
              <div class="metric">
                <span class="metric-label">Components</span>
                <span class="metric-value">${pct(componentProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-comp"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>
              <div class="metric">
                <span class="metric-label">Auto-layout</span>
                <span class="metric-value">${pct(autoLayoutProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-auto"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>
              <div class="metric">
                <span class="metric-label">Numbered names</span>
                <span class="metric-value ${severity(numberedNameCount, 5, 12)}">${numberedNameCount}</span>
                <span class="metric-sub">layers whose name contains a digit</span>
              </div>
              <div class="metric">
                <span class="metric-label">Typefaces</span>
                <span class="metric-value ${severity(typefaceCount, 3, 5)}">${typefaceCount}</span>
                ${renderTags(typefaceNames)}
              </div>
            </div>

            <!-- ── Section 2: Code complexity ── -->
            <div class="section-title">Code complexity</div>
            <div class="grid">
              <div class="metric">
                <span class="metric-label">Effects</span>
                <span class="metric-value ${severity(effectCount, 6, 16)}">${effectCount}</span>
                <span class="metric-sub">shadows, blurs applied</span>
              </div>
              <div class="metric">
                <span class="metric-label">Groups</span>
                <span class="metric-value ${severity(groupCount, 1, 6)}">${groupCount}</span>
                <span class="metric-sub">use frames instead</span>
              </div>
              <div class="metric wide">
                <span class="metric-label">Off-grid spacing</span>
                <span class="metric-value ${severity(unusualSpacingCount, 4, 12)}">${unusualSpacingCount}</span>
                ${renderTags(spacingTags.slice(0, 6))}
              </div>
            
            </div>

            <!-- ── Section 3: Accessibility ── -->
            <div class="section-title">Accessibility</div>
            <div class="grid">
              <div class="metric wide">
                <span class="metric-label">Violations</span>
                <span class="metric-value ${severity(accessibilityViolations, 1, 5)}">${accessibilityViolations}</span>
                <span class="metric-sub">contrast + touch target issues</span>
                ${renderTags((accessibilityDetails || []).slice(0, 6), 'violation')}
              </div>
            </div>

            <!-- ── Section 4: Design tokens ── -->
            <div class="section-title">Design tokens</div>
            <div class="grid">
              <div class="metric wide">
                <span class="metric-label">Unlinked styles <span class="author">Aiden</span></span>
                <span class="metric-value ${severity(totalStyles, 3, 8)}">${totalStyles}</span>
                <span class="metric-sub">properties with a value but no reusable style</span>
              </div>
            </div>

            <!-- ── Section 5: Violation node list ── -->
            <div class="section-title">Violations — click to select in Figma</div>
            <div class="vlist-section">
              ${renderViolationGroup('Accessibility',       '⚠',  accessibilityNodes  || [])}
              ${renderViolationGroup('Unlinked styles',     '🎨', unlinkedStyleNodes  || [])}
              ${renderViolationGroup('Off-grid spacing',    '📐', offGridNodes        || [])}
              ${renderViolationGroup('Numbered names',      '#',  numberedNameNodes   || [])}
              ${renderViolationGroup('No auto-layout',      '⬜', noAutoLayoutNodes   || [])}
            </div>
          `;

          requestAnimationFrame(() => {
            document.querySelectorAll('.metric').forEach(el => el.classList.add('visible'));
            document.getElementById('bar-comp').style.width = pct(componentProportion);
            document.getElementById('bar-auto').style.width = pct(autoLayoutProportion);
          });
        }
      };
    </script>
  </body>
</html>
