<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'DM Sans', sans-serif;
        background: #0f0f0f;
        color: #f0ede8;
        padding: 20px;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0ede8;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6c38f5;
        display: inline-block;
        margin-left: 2px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      button {
        width: 100%;
        padding: 11px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
        border-radius: 8px;
        border: none;
        background: #6c38f5;
        color: #0f0f0f;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }

      button:hover  { opacity: 0.88; }
      button:active { transform: scale(0.98); }

      /* ── metric grid ── */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .metric {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .metric.visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* stagger delays */
      .metric:nth-child(1) { transition-delay: 0.00s; }
      .metric:nth-child(2) { transition-delay: 0.06s; }
      .metric:nth-child(3) { transition-delay: 0.12s; }
      .metric:nth-child(4) { transition-delay: 0.18s; }
      .metric:nth-child(5) { transition-delay: 0.24s; }

      /* wide card spans both columns */
      .metric.wide { grid-column: 1 / -1; }

      .metric-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #666;
      }

      .metric-value {
        font-family: 'DM Mono', monospace;
        font-size: 26px;
        font-weight: 500;
        color: #f0ede8;
        line-height: 1;
      }

      /* proportion bar */
      .bar-track {
        height: 4px;
        background: #2a2a2a;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 4px;
      }

      .bar-fill {
        height: 100%;
        border-radius: 99px;
        background: #c8f560;
        width: 0%;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .metric-sub {
        font-size: 10px;
        color: #555;
        font-family: 'DM Mono', monospace;
      }

      /* error */
      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #1f0f0f;
        border: 1px solid #4a1a1a;
        color: #ff6b6b;
        font-size: 12px;
        line-height: 1.5;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Frame Inspector</h1>
      <span class="dot"></span>
    </header>

    <button id="analyze">Analyze selection</button>

    <div id="output"></div>

    <script>
      const output     = document.getElementById('output');
      const analyzeBtn = document.getElementById('analyze');

      analyzeBtn.onclick = () => {
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
      };

      function pct(val) {
        return (val * 100).toFixed(1) + '%';
      }

      onmessage = (event) => {
        const msg = event.data.pluginMessage;

        if (msg.type === 'error') {
          output.innerHTML = `<div class="error">${msg.message}</div>`;
          return;
        }

        if (msg.type === 'result') {
          const { totalNodes, maxDepth, componentProportion, autoLayoutProportion, numberedNameCount } = msg.data;

          output.innerHTML = `
            <div class="grid">
              <div class="metric" id="m0">
                <span class="metric-label">Elements</span>
                <span class="metric-value">${totalNodes}</span>
              </div>

              <div class="metric" id="m1">
                <span class="metric-label">Max depth</span>
                <span class="metric-value">${maxDepth}</span>
              </div>

              <div class="metric" id="m2">
                <span class="metric-label">Components</span>
                <span class="metric-value">${pct(componentProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-comp"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>

              <div class="metric" id="m3">
                <span class="metric-label">Auto-layout</span>
                <span class="metric-value">${pct(autoLayoutProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-auto"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>

              <div class="metric wide" id="m4">
                <span class="metric-label">Numbered names</span>
                <span class="metric-value">${numberedNameCount}</span>
                <span class="metric-sub">layers whose name contains a digit</span>
              </div>
            </div>
          `;

          // trigger entrance animation + bar widths on next frame
          requestAnimationFrame(() => {
            document.querySelectorAll('.metric').forEach(el => el.classList.add('visible'));
            document.getElementById('bar-comp').style.width = pct(componentProportion);
            document.getElementById('bar-auto').style.width = pct(autoLayoutProportion);
          });
        }
      };
    </script>
  </body>
</html>
