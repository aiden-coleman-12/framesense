<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'DM Sans', sans-serif;
        background: #f5f4f2;
        color: #1a1a1a;
        padding: 20px;
        min-height: 100vh;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #1a1a1a;
      }

      .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: #6c38f5;
        display: inline-block;
        margin-left: 2px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }

      .mode-toggle {
        display: flex;
        gap: 0;
        margin-bottom: 20px;
        border-bottom: 2px solid #dddbd8;
      }

      .mode-btn {
        flex: 1;
        padding: 9px 12px 10px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        border: none;
        border-bottom: 2px solid transparent;
        margin-bottom: -2px;
        background: transparent;
        color: #bbb;
        cursor: pointer;
        transition: color 0.15s, border-color 0.15s;
        width: auto;
        border-radius: 0;
      }

      .mode-btn:hover { color: #666; }

      .mode-btn.active {
        color: #1a1a1a;
        border-bottom-color: #1a1a1a;
      }

      button.primary {
        width: 100%;
        padding: 12px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.03em;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #B93CFC 0%, #EA2CC0 55%, #F42436 100%);
        background-size: 200% 200%;
        color: #fff;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.2s, background-position 0.4s;
        box-shadow: 0 2px 12px rgba(124, 58, 237, 0.3);
        position: relative;
        overflow: hidden;
      }
      button.primary::after {
        content: '→';
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%) translateX(0px);
        transition: transform 0.2s;
        font-size: 14px;
      }
      button.primary:hover {
        background-position: 100% 0;
        box-shadow: 0 4px 20px rgba(124, 58, 237, 0.42);
        transform: translateY(-1px);
      }
      button.primary:hover::after { transform: translateY(-50%) translateX(3px); }
      button.primary:active { transform: scale(0.98) translateY(0); }

      select {
        width: 100%;
        padding: 11px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        background: #eceae7;
        color: #1a1a1a;
        border: 1px solid #dddbd8;
        border-radius: 8px;
        margin-bottom: 10px;
        appearance: none;
      }

      .flow-banner {
        font-size: 11px;
        color: #888;
        font-family: 'DM Mono', monospace;
        margin-bottom: 18px;
      }

      /* ── Quick-glance bar (build complexity) ── */
      .quickglance {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 1px;
        background: #dddbd8;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 28px;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .quickglance.visible { opacity: 1; transform: translateY(0); }

      .qg-item {
        background: #eceae7;
        padding: 14px 12px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .qg-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #888;
      }

      .qg-value {
        font-family: 'DM Mono', monospace;
        font-size: 22px;
        font-weight: 500;
        color: #1a1a1a;
        line-height: 1;
      }

      .qg-sub {
        font-size: 9px;
        color: #999;
        font-family: 'DM Mono', monospace;
        margin-top: 1px;
      }

      /* ── Section headings (flat, no box) ── */
      .section-label {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #6c38f5;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-label.engineer { color: #2277cc; }
      .section-label.shared   { color: #888; }
      .section-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #dddbd8;
      }

      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #1a1a1a;
        margin-bottom: 2px;
      }

      .section-desc {
        font-size: 11px;
        color: #888;
        margin-bottom: 14px;
      }

      .section-block {
        margin-bottom: 28px;
      }

      /* ── Metric grid ── */
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .metric {
        background: #eceae7;
        border-radius: 10px;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }
      .metric.visible { opacity: 1; transform: translateY(0); }

      .metric:nth-child(1)  { transition-delay: 0.05s; }
      .metric:nth-child(2)  { transition-delay: 0.10s; }
      .metric:nth-child(3)  { transition-delay: 0.15s; }
      .metric:nth-child(4)  { transition-delay: 0.20s; }
      .metric:nth-child(5)  { transition-delay: 0.25s; }
      .metric:nth-child(6)  { transition-delay: 0.30s; }

      .metric.wide { grid-column: 1 / -1; }

      .metric-label {
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #888;
      }

      .metric-value {
        font-family: 'DM Mono', monospace;
        font-size: 26px;
        font-weight: 500;
        color: #1a1a1a;
        line-height: 1;
      }
      .metric-value.warn   { color: #c47d00; }
      .metric-value.danger { color: #d63b3b; }
      .metric-value.ok     { color: #1a9e2e; }

      .bar-track {
        height: 3px;
        background: #dddbd8;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 4px;
      }
      .bar-fill {
        height: 100%;
        border-radius: 99px;
        background: #6c38f5;
        width: 0%;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .metric-sub {
        font-size: 10px;
        color: #999;
        font-family: 'DM Mono', monospace;
      }

      .feedback {
        font-size: 11px;
        font-family: 'DM Sans', sans-serif;
        line-height: 1.5;
        padding-top: 7px;
        margin-top: 2px;
        border-top: 1px solid #dddbd8;
      }
      .feedback.ok     { color: #1a9e2e; }
      .feedback.warn   { color: #c47d00; }
      .feedback.danger { color: #d63b3b; }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 2px;
      }
      .tag {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        background: #e0deda;
        border-radius: 4px;
        padding: 2px 7px;
        color: #888;
      }
      .tag.violation {
        color: #d63b3b;
        background: #fce8e8;
      }

      /* ── Violation groups ── */
      .vlist-section {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .vgroup {
        border-radius: 8px;
        overflow: hidden;
      }

      .vgroup-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        background: #eceae7;
        cursor: pointer;
        user-select: none;
        transition: background 0.15s;
        border-radius: 8px;
      }
      .vgroup.open .vgroup-header {
        border-radius: 8px 8px 0 0;
      }
      .vgroup-header:hover { background: #e5e3e0; }

      .vgroup-title {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #888;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .vgroup-count {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        font-weight: 500;
        color: #c47d00;
      }
      .vgroup-count.danger { color: #d63b3b; }
      .vgroup-count.ok     { color: #1a9e2e; }

      .vgroup-chevron {
        font-size: 9px;
        color: #999;
        transition: transform 0.2s;
      }
      .vgroup.open .vgroup-chevron { transform: rotate(180deg); }

      .vgroup-body {
        display: none;
        flex-direction: column;
        background: #f0ede9;
        border-radius: 0 0 8px 8px;
      }
      .vgroup.open .vgroup-body { display: flex; }

      .vnode {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid #e5e3e0;
        cursor: pointer;
        transition: background 0.12s;
      }
      .vnode:hover  { background: #e8e6e2; }
      .vnode:active { background: #e0deda; }

      .vnode-icon { font-size: 11px; flex-shrink: 0; opacity: 0.4; }

      .vnode-name {
        font-family: 'DM Mono', monospace;
        font-size: 11px;
        color: #333;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .vnode-arrow {
        font-size: 9px;
        color: #aaa;
        flex-shrink: 0;
        transition: color 0.12s;
      }
      .vnode:hover .vnode-arrow { color: #888; }

      .vnode-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        overflow: hidden;
      }

      .vnode-details {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        color: #888;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .empty-state {
        padding: 10px 12px;
        border-top: 1px solid #e5e3e0;
        font-size: 11px;
        color: #1a9e2e;
        font-family: 'DM Mono', monospace;
      }

      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fce8e8;
        border: 1px solid #f5c0c0;
        color: #d63b3b;
        font-size: 12px;
        line-height: 1.5;
      }

      /* thin divider */
      .divider {
        height: 1px;
        background: #dddbd8;
        margin: 24px 0;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Frame Inspector</h1>
      <span class="dot"></span>
    </header>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-frame" onclick="setMode('frame')">Single frame</button>
      <button class="mode-btn"        id="btn-flow"  onclick="setMode('flow')">Entire flow</button>
    </div>

    <div id="panel-frame">
      <button class="primary" id="analyze">Analyze selection</button>
    </div>

    <div id="panel-flow" style="display:none">
      <select id="flow-select">
        <option value="">— select a frame to see flows —</option>
      </select>
      <button class="primary" id="analyze-flow">Analyze flow</button>
    </div>

    <div id="output" style="margin-top: 20px;"></div>

    <script>
      const output = document.getElementById('output');

      window.onload = () => {
        parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
      };

      function setMode(mode) {
        document.getElementById('panel-frame').style.display = mode === 'frame' ? 'block' : 'none';
        document.getElementById('panel-flow').style.display  = mode === 'flow'  ? 'block' : 'none';
        document.getElementById('btn-frame').classList.toggle('active', mode === 'frame');
        document.getElementById('btn-flow').classList.toggle('active',  mode === 'flow');
        output.innerHTML = '';
      }

      document.getElementById('analyze').onclick = () => {
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
      };

      document.getElementById('analyze-flow').onclick = () => {
        const nodeId = document.getElementById('flow-select').value;
        if (!nodeId) return;
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-flow', nodeId } }, '*');
      };

      function pct(val) { return (val * 100).toFixed(1) + '%'; }

      // Scale thresholds upward for large frames so isolated counts
      // aren't penalised on dense, complex screens.
      // ≤200 nodes → 1×  |  ≤500 → 1.3×  |  ≤1000 → 1.7×  |  >1000 → 2.2×
      function nodeScaleFactor(n) {
        if (n <= 200)  return 1.0;
        if (n <= 500)  return 1.3;
        if (n <= 1000) return 1.7;
        return 2.2;
      }

      function severity(val, warnAt, dangerAt, nodeCount = 0) {
        const scale = nodeScaleFactor(nodeCount);
        if (val >= dangerAt * scale) return 'danger';
        if (val >= warnAt   * scale) return 'warn';
        return 'ok';
      }

      function renderTags(items, className = '') {
        if (!items || items.length === 0) return '';
        return `<div class="tag-list">${items.map(t => `<span class="tag ${className}">${t}</span>`).join('')}</div>`;
      }

      function selectNode(id) {
        parent.postMessage({ pluginMessage: { type: 'select-node', id } }, '*');
      }

      function renderViolationGroup(title, icon, nodes) {
        const count    = nodes.length;
        const cntClass = count === 0 ? 'ok' : count >= 5 ? 'danger' : '';
        const rows = count === 0
          ? `<div class="empty-state">No violations ✓</div>`
          : nodes.map(n => `
              <div class="vnode" onclick="selectNode('${n.id}')">
                <span class="vnode-icon">${icon}</span>
                <div class="vnode-text">
                  <span class="vnode-name" title="${n.name}">${n.name}</span>
                  ${n.details ? `<span class="vnode-details">${n.details}</span>` : ''}
                </div>
                <span class="vnode-arrow">▶</span>
              </div>`).join('');

        return `
          <div class="vgroup">
            <div class="vgroup-header" onclick="this.closest('.vgroup').classList.toggle('open')">
              <span class="vgroup-title">
                ${title}
                <span class="vgroup-count ${cntClass}">${count}</span>
              </span>
              <span class="vgroup-chevron">▼</span>
            </div>
            <div class="vgroup-body">${rows}</div>
          </div>`;
      }

      // ── Feedback functions ───────────────────────────────────────────────────
      function feedbackNodes(val) {
        if (val <= 200) return { cls: 'ok',     msg: 'Node count is manageable — should be straightforward to build.' };
        if (val <= 500) return { cls: 'warn',   msg: 'Fairly large frame. Consider breaking it into smaller components.' };
        return           { cls: 'danger', msg: 'Very high node count. High build complexity — strongly consider componentizing.' };
      }
      function feedbackDepth(val) {
        if (val <= 5)  return { cls: 'ok',     msg: 'Shallow nesting — easy to implement and maintain.' };
        if (val <= 8)  return { cls: 'ok',     msg: 'Reasonable depth — manageable for most developers.' };
        if (val <= 14) return { cls: 'warn',   msg: 'Getting deep. Consider flattening layers or splitting into components.' };
        return           { cls: 'danger', msg: 'Very deep nesting. High risk of brittle, hard-to-maintain code.' };
      }
      function feedbackComponents(val) {
        const p = val * 100;
        if (p >= 70) return { cls: 'ok',     msg: 'Great component usage — expect a reusable, consistent codebase.' };
        if (p >= 40) return { cls: 'warn',   msg: 'Moderate component use. More reuse would reduce development time.' };
        return         { cls: 'danger', msg: 'Low component usage. Developers may need to rebuild many elements from scratch.' };
      }
      function feedbackAutoLayout(val) {
        const p = val * 100;
        if (p >= 70) return { cls: 'ok',     msg: 'Strong auto-layout use — translates cleanly to flexbox and CSS grid.' };
        if (p >= 40) return { cls: 'warn',   msg: 'Mixed layout styles. Some screens may need manual spacing logic in code.' };
        return         { cls: 'danger', msg: 'Little auto-layout detected. Developers will likely need to hardcode sizes and positions.' };
      }
      function feedbackNumberedNames(val) {
        if (val === 0) return { cls: 'ok',     msg: 'All layers are meaningfully named — easy for developers to navigate.' };
        if (val <= 5)  return { cls: 'warn',   msg: 'A few auto-generated layer names. Renaming them will help the handoff.' };
        return           { cls: 'danger', msg: 'Many unnamed layers. Rename them so developers can understand the structure.' };
      }
      function feedbackTypefaces(val) {
        if (val <= 2) return { cls: 'ok',     msg: 'Minimal typefaces — easy to set up a clean typography system.' };
        if (val <= 4) return { cls: 'warn',   msg: 'Several fonts in use. Make sure each has a clear role in the type scale.' };
        return          { cls: 'danger', msg: 'Too many typefaces. Consolidate to 2–3 max to keep the design system manageable.' };
      }
      function feedbackEffects(val) {
        if (val === 0) return { cls: 'ok',     msg: 'No effects — clean and easy to implement.' };
        if (val <= 5)  return { cls: 'ok',     msg: 'Light effect use — should be straightforward to replicate in CSS.' };
        if (val <= 15) return { cls: 'warn',   msg: 'Moderate effects. Each shadow or blur needs a corresponding CSS rule.' };
        return           { cls: 'danger', msg: 'Heavy effect use. May cause performance issues and complex CSS.' };
      }
      function feedbackGroups(val) {
        if (val === 0) return { cls: 'ok',     msg: 'No groups — clean frame-based structure, great for code generation.' };
        if (val <= 3)  return { cls: 'warn',   msg: 'A few groups found. Try converting them to auto-layout frames.' };
        return           { cls: 'danger', msg: 'Many groups detected. Groups have no layout rules and are hard to translate to code. Replace with frames.' };
      }
      function feedbackSpacing(val) {
        if (val === 0) return { cls: 'ok',     msg: 'All spacing is on-grid — consistent and easy to implement with tokens.' };
        if (val <= 3)  return { cls: 'warn',   msg: 'A few off-grid values. Snap them to your spacing scale if possible.' };
        return           { cls: 'danger', msg: 'Many off-grid spacing values. Likely to cause inconsistency in code. Align to an 8pt grid.' };
      }
      function feedbackAccessibility(val) {
        if (val === 0) return { cls: 'ok',     msg: 'No accessibility issues detected. Good to go.' };
        if (val <= 3)  return { cls: 'warn',   msg: 'A few issues found. Review contrast ratios and touch target sizes.' };
        return           { cls: 'danger', msg: 'Multiple accessibility violations. Address before handoff to avoid costly rework.' };
      }
      function feedbackStyles(val) {
        if (val === 0) return { cls: 'ok',     msg: 'All properties are linked to styles. Token-ready codebase.' };
        if (val <= 5)  return { cls: 'warn',   msg: 'Some unlinked properties. Connect them to styles for easier theming.' };
        return           { cls: 'danger', msg: 'Many unlinked properties. Hard to maintain consistency — link to a style or variable system.' };
      }

      function fb(obj) {
        return `<p class="feedback ${obj.cls}">${obj.msg}</p>`;
      }

      // ── Message handler ──────────────────────────────────────────────────────
      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        if (msg.type === 'flows-list') {
          const select = document.getElementById('flow-select');
          select.innerHTML = '';
          if (!msg.flows || msg.flows.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'No flows found for this selection';
            select.appendChild(opt);
          } else {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '— select a flow —';
            select.appendChild(placeholder);
            msg.flows.forEach(f => {
              const opt = document.createElement('option');
              opt.value = f.nodeId;
              opt.textContent = f.name;
              select.appendChild(opt);
            });
          }
          return;
        }

        if (msg.type === 'error') {
          output.innerHTML = `<div class="error">${msg.message}</div>`;
          return;
        }

        if (msg.type === 'result') {
          const {
            totalNodes, maxDepth, componentProportion, autoLayoutProportion,
            numberedNameCount, effectCount, groupCount, unusualSpacingCount,
            unusualSpacingValues, typefaceCount, typefaceNames,
            accessibilityViolations, accessibilityDetails, totalStyles,
            accessibilityNodes, unlinkedStyleNodes, offGridNodes,
            numberedNameNodes, noAutoLayoutNodes,
          } = msg.data;

          const spacingTags = (unusualSpacingValues || []).map(v => v + 'px');
          const banner = msg.mode === 'flow'
            ? `<p class="flow-banner">${msg.frameCount} frames analyzed across flow</p>`
            : '';

          output.innerHTML = `
            ${banner}

            <!-- ══ QUICK-GLANCE: Build complexity ══ -->
            <div class="quickglance" id="quickglance">
              <div class="qg-item">
                <span class="qg-label">Elements</span>
                <span class="qg-value">${totalNodes}</span>
                <span class="qg-sub">total nodes</span>
              </div>
              <div class="qg-item">
                <span class="qg-label">Max depth</span>
                <span class="qg-value">${maxDepth}</span>
                <span class="qg-sub">nesting levels</span>
              </div>
              <div class="qg-item">
                <span class="qg-label">Effects</span>
                <span class="qg-value">${effectCount}</span>
                <span class="qg-sub">shadows / blurs</span>
              </div>
              <div class="qg-item">
                <span class="qg-label">Typefaces</span>
                <span class="qg-value">${typefaceCount}</span>
                <span class="qg-sub">${(typefaceNames || []).slice(0,2).join(', ')|| 'n/a'}</span>
              </div>
            </div>

            <!-- ══ SECTION 1: FOR DESIGNERS ══ -->
            <div class="section-block">
              <div class="section-label">For designers</div>
              <div class="section-title">Fix before handoff</div>
              <div class="section-desc">Issues you can resolve directly in Figma right now</div>
              <div class="grid">
                <div class="metric">
                  <span class="metric-label">Numbered names</span>
                  <span class="metric-value ${severity(numberedNameCount, 5, 12, totalNodes)}">${numberedNameCount}</span>
                  <span class="metric-sub">layers with auto-generated names</span>
                  ${fb(feedbackNumberedNames(numberedNameCount))}
                </div>
                <div class="metric">
                  <span class="metric-label">Groups</span>
                  <span class="metric-value ${severity(groupCount, 1, 6, totalNodes)}">${groupCount}</span>
                  <span class="metric-sub">replace with frames</span>
                  ${fb(feedbackGroups(groupCount))}
                </div>
                <div class="metric">
                  <span class="metric-label">Off-grid spacing</span>
                  <span class="metric-value ${severity(unusualSpacingCount, 4, 12, totalNodes)}">${unusualSpacingCount}</span>
                  ${renderTags(spacingTags.slice(0, 6))}
                  ${fb(feedbackSpacing(unusualSpacingCount))}
                </div>
                <div class="metric">
                  <span class="metric-label">Unlinked styles</span>
                  <span class="metric-value ${severity(totalStyles, 3, 8, totalNodes)}">${totalStyles}</span>
                  <span class="metric-sub">no reusable style attached</span>
                  ${fb(feedbackStyles(totalStyles))}
                </div>
                <div class="metric wide">
                  <span class="metric-label">Accessibility violations</span>
                  <span class="metric-value ${severity(accessibilityViolations, 1, 5, totalNodes)}">${accessibilityViolations}</span>
                  <span class="metric-sub">contrast + touch target issues</span>
                  ${fb(feedbackAccessibility(accessibilityViolations))}
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <!-- ══ SECTION 2: DESIGN QUALITY ══ -->
            <div class="section-block">
              <div class="section-label shared">For everyone</div>
              <div class="section-title">Design quality</div>
              <div class="section-desc">Proportions and structure relevant to the whole team</div>
              <div class="grid">
                <div class="metric">
                  <span class="metric-label">Components</span>
                  <span class="metric-value">${pct(componentProportion)}</span>
                  <div class="bar-track"><div class="bar-fill" id="bar-comp"></div></div>
                  <span class="metric-sub">of all frame-like nodes</span>
                  ${fb(feedbackComponents(componentProportion))}
                </div>
                <div class="metric">
                  <span class="metric-label">Auto-layout</span>
                  <span class="metric-value">${pct(autoLayoutProportion)}</span>
                  <div class="bar-track"><div class="bar-fill" id="bar-auto"></div></div>
                  <span class="metric-sub">of all frame-like nodes</span>
                  ${fb(feedbackAutoLayout(autoLayoutProportion))}
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <!-- ══ VIOLATION LISTS ══ -->
            <div class="section-block">
              <div class="section-label shared">For everyone</div>
              <div class="section-title">Violations</div>
              <div class="section-desc">Expand a category to jump directly to problem layers</div>
              <div class="vlist-section">
                ${renderViolationGroup('Accessibility',    '⚠',  accessibilityNodes  || [])}
                ${renderViolationGroup('Unlinked styles',  '🎨', unlinkedStyleNodes  || [])}
                ${renderViolationGroup('Off-grid spacing', '📐', offGridNodes        || [])}
                ${renderViolationGroup('Numbered names',   '#',  numberedNameNodes   || [])}
                ${renderViolationGroup('No auto-layout',   '⬜', noAutoLayoutNodes   || [])}
              </div>
            </div>
          `;

          requestAnimationFrame(() => {
            document.getElementById('quickglance').classList.add('visible');
            document.querySelectorAll('.metric').forEach(el => el.classList.add('visible'));
            document.getElementById('bar-comp').style.width = pct(componentProportion);
            document.getElementById('bar-auto').style.width = pct(autoLayoutProportion);
          });
        }
      };
    </script>
  </body>
</html>
