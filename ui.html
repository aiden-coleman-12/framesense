<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

     html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
   background: #0f0f0f;
        color: #f0ede8;
}

body {
  font-family: Inter, sans-serif;
    overflow-y: auto;
  overflow-x: hidden;
}

#app {
  box-sizing: border-box;
  width: 100%;
  min-height: 100%;
  padding: 16px;
}

      header {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #f0ede8;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #6c38f5;
        display: inline-block;
        margin-left: 2px;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      button {
        width: 100%;
        padding: 14px 18px;
        font-family: 'DM Sans', sans-serif;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 0.03em;
        border-radius: 8px;
        border: none;
        background: #38a9f5;
        color: #0f0f0f;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }

      button:hover  { opacity: 0.88; }
      button:active { transform: scale(0.98); }

      .section-title {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #d1c3c3;
        margin: 22px 0 12px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      .metric {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.3s ease, transform 0.3s ease;
      }

      .metric.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .metric:nth-child(1)  { transition-delay: 0.00s; }
      .metric:nth-child(2)  { transition-delay: 0.06s; }
      .metric:nth-child(3)  { transition-delay: 0.12s; }
      .metric:nth-child(4)  { transition-delay: 0.18s; }
      .metric:nth-child(5)  { transition-delay: 0.24s; }
      .metric:nth-child(6)  { transition-delay: 0.30s; }
      .metric:nth-child(7)  { transition-delay: 0.36s; }
      .metric:nth-child(8)  { transition-delay: 0.42s; }
      .metric:nth-child(9)  { transition-delay: 0.48s; }
      .metric:nth-child(10) { transition-delay: 0.54s; }

      .metric.wide { grid-column: 1 / -1; }

      .metric-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #666;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .author {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #6c38f5;
        background: rgba(108, 56, 245, 0.12);
        border-radius: 4px;
        padding: 2px 6px;
      }

      .metric-value {
        font-family: 'DM Mono', monospace;
        font-size: 36px;
        font-weight: 500;
        color: #f0ede8;
        line-height: 1;
      }

      .metric-value.warn   { color: #f5a623; }
      .metric-value.danger { color: #ff6b6b; }
      .metric-value.ok     { color: #38f542; }

      .bar-track {
        height: 4px;
        background: #2a2a2a;
        border-radius: 99px;
        overflow: hidden;
        margin-top: 4px;
      }

      .bar-fill {
        height: 100%;
        border-radius: 99px;
        background: #c8f560;
        width: 0%;
        transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .metric-sub {
        font-size: 13px;
        color: #fffdfd;
        font-family: 'DM Mono', monospace;
      }

      .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 2px;
      }

      .tag {
        font-family: 'DM Mono', monospace;
        font-size: 13px;
        background: #222;
        border: 1px solid #333;
        border-radius: 5px;
        padding: 3px 9px;
        color: #999;
      }

      .error {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #1f0f0f;
        border: 1px solid #4a1a1a;
        color: #ff6b6b;
        font-size: 14px;
        line-height: 1.5;
      }

      .mode-toggle {
        display: flex;
        gap: 6px;
        margin-bottom: 16px;
      }

      .mode-btn {
        flex: 1;
        padding: 9px 12px;
        font-family: 'DM Sans', sans-serif;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        border: 1px solid #2a2a2a;
        background: #1a1a1a;
        color: #666;
        cursor: pointer;
        transition: all 0.15s;
        width: auto;
      }

      .mode-btn.active {
        background: #6c38f5;
        border-color: #6c38f5;
        color: #fff;
      }

      select {
        width: 100%;
        padding: 11px 14px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        background: #1a1a1a;
        color: #f0ede8;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        margin-bottom: 10px;
        appearance: none;
      }

      .flow-banner {
        font-size: 13px;
        color: #555;
        font-family: 'DM Mono', monospace;
        margin: 14px 0 -4px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Frame Inspector</h1>
      <span class="dot"></span>
    </header>

    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-frame" onclick="setMode('frame')">Single frame</button>
      <button class="mode-btn" id="btn-flow" onclick="setMode('flow')">Entire flow</button>
    </div>

    <div id="panel-frame">
      <button id="analyze">Analyze selection</button>
    </div>

    <div id="panel-flow" style="display:none">
      <select id="flow-select">
        <option value="">— select a frame to see flows —</option>
      </select>
      <button id="analyze-flow">Analyze flow</button>
    </div>

    <div id="output"></div>

    <script>
      const output = document.getElementById('output');

      // ── Signal to the plugin that the UI is ready to receive messages ───────
      window.onload = () => {
        parent.postMessage({ pluginMessage: { type: 'ui-ready' } }, '*');
      };

      function setMode(mode) {
        document.getElementById('panel-frame').style.display = mode === 'frame' ? 'block' : 'none';
        document.getElementById('panel-flow').style.display  = mode === 'flow'  ? 'block' : 'none';
        document.getElementById('btn-frame').classList.toggle('active', mode === 'frame');
        document.getElementById('btn-flow').classList.toggle('active',  mode === 'flow');
        output.innerHTML = '';
      }

      document.getElementById('analyze').onclick = () => {
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-selection' } }, '*');
      };

      document.getElementById('analyze-flow').onclick = () => {
        const nodeId = document.getElementById('flow-select').value;
        if (!nodeId) return;
        output.innerHTML = '';
        parent.postMessage({ pluginMessage: { type: 'analyze-flow', nodeId } }, '*');
      };

      function pct(val) {
        return (val * 100).toFixed(1) + '%';
      }

      function severity(val, warnAt, dangerAt) {
        if (val >= dangerAt) return 'danger';
        if (val >= warnAt)   return 'warn';
        return 'ok';
      }

      function renderTags(items) {
        if (!items || items.length === 0) return '';
        return `<div class="tag-list">${items.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
      }

      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;

        // ── Populate the flow dropdown ──────────────────────────────────────
        if (msg.type === 'flows-list') {
          const select = document.getElementById('flow-select');
          select.innerHTML = ''; // always clear first
          if (!msg.flows || msg.flows.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = 'No flows found for this selection';
            select.appendChild(opt);
          } else {
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = '— select a flow —';
            select.appendChild(placeholder);
            msg.flows.forEach(f => {
              const opt = document.createElement('option');
              opt.value = f.nodeId;
              opt.textContent = f.name;
              select.appendChild(opt);
            });
          }
        }

        if (msg.type === 'error') {
          output.innerHTML = `<div class="error">${msg.message}</div>`;
          return;
        }

        if (msg.type === 'result') {
          const {
            totalNodes, maxDepth, componentProportion, autoLayoutProportion,
            numberedNameCount, effectCount, groupCount, unusualSpacingCount,
            unusualSpacingValues, typefaceCount, typefaceNames,
          } = msg.data;

          const spacingTags = (unusualSpacingValues || []).map(v => v + 'px');
          const banner = msg.mode === 'flow'
            ? `<p class="flow-banner">${msg.frameCount} frames analyzed across flow</p>`
            : '';

          output.innerHTML = `
            ${banner}
            <div class="grid">
              <div class="metric">
                <span class="metric-label">Elements</span>
                <span class="metric-value">${totalNodes}</span>
              </div>
              <div class="metric">
                <span class="metric-label">Max depth</span>
                <span class="metric-value ${severity(maxDepth, 8, 14)}">${maxDepth}</span>
              </div>
              <div class="metric">
                <span class="metric-label">Components</span>
                <span class="metric-value">${pct(componentProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-comp"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>
              <div class="metric">
                <span class="metric-label">Auto-layout</span>
                <span class="metric-value">${pct(autoLayoutProportion)}</span>
                <div class="bar-track"><div class="bar-fill" id="bar-auto"></div></div>
                <span class="metric-sub">of all frame-like nodes</span>
              </div>
              <div class="metric wide">
                <span class="metric-label">Numbered names</span>
                <span class="metric-value ${severity(numberedNameCount, 5, 12)}">${numberedNameCount}</span>
                <span class="metric-sub">layers whose name contains a digit</span>
              </div>
            </div>

            <div class="section-title">Code complexity</div>
            <div class="grid">
              <div class="metric">
                <span class="metric-label">Effects <span class="author">Dan</span></span>
                <span class="metric-value ${severity(effectCount, 6, 16)}">${effectCount}</span>
                <span class="metric-sub">shadows, blurs applied</span>
              </div>
              <div class="metric">
                <span class="metric-label">Groups <span class="author">Dan</span></span>
                <span class="metric-value ${severity(groupCount, 1, 6)}">${groupCount}</span>
                <span class="metric-sub">use frames instead</span>
              </div>
              <div class="metric">
                <span class="metric-label">Off-grid spacing <span class="author">Dan</span></span>
                <span class="metric-value ${severity(unusualSpacingCount, 4, 12)}">${unusualSpacingCount}</span>
                ${renderTags(spacingTags.slice(0, 6))}
              </div>
              <div class="metric">
                <span class="metric-label">Typefaces <span class="author">Dan</span></span>
                <span class="metric-value ${severity(typefaceCount, 3, 5)}">${typefaceCount}</span>
                ${renderTags(typefaceNames)}
              </div>
            </div>
          `;

          requestAnimationFrame(() => {
            document.querySelectorAll('.metric').forEach(el => el.classList.add('visible'));
            document.getElementById('bar-comp').style.width = pct(componentProportion);
            document.getElementById('bar-auto').style.width = pct(autoLayoutProportion);
          });
        }
      };
    </script>
  </body>
</html>
